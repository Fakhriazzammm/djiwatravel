# Snippet for the 443 server block in /etc/nginx/sites-enabled/djiwatravel (Travel VPS).
# While autodeploy restarts the app (a few seconds), nginx shows a friendly auto-refreshing page
# instead of a bare 502. Status codes are unchanged, so webhooks and fetch() callers still see 502
# and retry. The page is copied to /var/www/djiwa-updating/ because nginx cannot read /home/ubuntu.
#
#   sudo install -d /var/www/djiwa-updating
#   sudo install -m 644 public/updating.html /var/www/djiwa-updating/updating.html
#   sudo nginx -t && sudo systemctl reload nginx
error_page 502 503 504 /__updating.html;
location = /__updating.html {
    internal;
    alias /var/www/djiwa-updating/updating.html;
    add_header Cache-Control "no-store" always;
}

