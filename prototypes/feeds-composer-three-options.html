<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membuat post Feeds — 3 opsi</title><style>
:root{--bg:#f3f4f6;--fg:#15171b;--mut:#666a73;--bd:#e3e4e7;--red:#ed2935;--soft:#fbe5e4;--ok:#17803d}
*{box-sizing:border-box}body{margin:0;background:#e8e9ec;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:inherit}button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.top{max-width:470px;margin:0 auto 10px}.top h1{font-size:18px;margin:0 0 4px}.top p{font-size:12px;color:var(--mut);margin:0 0 10px;line-height:1.5}
.tabs{display:flex;gap:6px}.tabs button{flex:1;border-radius:12px;padding:9px 4px;background:#fff;font-size:12px;font-weight:650;text-align:center}.tabs button[aria-selected=true]{background:var(--fg);color:#fff}
.note{max-width:470px;margin:0 auto 12px;font-size:12px;line-height:1.55;color:var(--mut);min-height:62px}
.phone{position:relative;width:390px;max-width:100%;height:780px;margin:auto;background:#fff;border:1px solid var(--bd);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;height:48px;padding:0 12px;flex-shrink:0}.bar .x{width:36px;height:36px;display:grid;place-items:center;font-size:16px;border-radius:50%}.bar h2{flex:1;margin:0;font-size:15px;text-align:center}
.send{min-height:34px;padding:0 16px;border-radius:17px;background:var(--red);color:#fff;font-size:13px;font-weight:650}.send[disabled]{opacity:.35}
.body{flex:1;overflow:auto;padding:0 16px 16px;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.me{display:flex;align-items:center;gap:8px;margin:2px 0 10px}.av{width:30px;height:30px;border-radius:50%;background:#c2410c;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}.me small{font-size:11px;color:var(--mut);display:block}.me strong{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 12px;border-radius:16px;background:var(--bg);font-size:12px;font-weight:600;margin:0 6px 6px 0}.chip.on{background:var(--fg);color:#fff}.chip.red{background:var(--soft);color:var(--red)}.chip.ok{background:#e2f4e8;color:var(--ok)}
.ta{width:100%;min-height:110px;border:0;outline:0;resize:none;font:inherit;font-size:16px;line-height:1.45;padding:0;color:var(--fg);background:none}
.tool{display:flex;gap:4px;border-top:1px solid var(--bd);padding:8px 12px 10px;flex-shrink:0;align-items:center}.tool button{height:36px;padding:0 11px;border-radius:18px;font-size:12px;font-weight:650;display:flex;align-items:center;gap:5px}.tool button.on{background:var(--soft);color:var(--red)}.tool .cnt{margin-left:auto;font-size:11px;color:var(--mut)}
.sug{background:var(--bg);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:12px;line-height:1.4}.sug b{display:block;font-size:13px;margin-bottom:2px}.sug button{margin-top:6px;font-weight:700;color:var(--red);min-height:30px}
.priv{font-size:11px;color:var(--mut);line-height:1.45;padding:8px 16px 14px;flex-shrink:0}
/* 1 photo first */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.gp{aspect-ratio:1;position:relative;color:#fff;font-size:10px;display:grid;place-items:center}.gp.sel::after{content:attr(data-n);position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--red);font-size:11px;font-weight:700;display:grid;place-items:center}.gp.sel{outline:3px solid var(--red);outline-offset:-3px}
.prev{height:200px;border-radius:16px;margin:2px 0 10px;position:relative;color:#fff;display:grid;place-items:center;font-size:12px}.prev .pc{position:absolute;left:10px;bottom:10px;background:#000a;border-radius:12px;padding:5px 10px;font-size:11px}
.cap{width:100%;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:14px;min-height:64px;color:var(--mut)}.cap.f{color:var(--fg)}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;text-align:center;background:var(--bg);border-radius:10px;min-height:34px;font-size:12px;font-weight:650}.seg button.on{background:var(--fg);color:#fff}
/* 3 from agenda */
.pl{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%;min-height:52px}.pl .th{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0}.pl strong{font-size:13px;display:block}.pl small{font-size:11px;color:var(--mut)}.pl .go{margin-left:auto;font-size:12px;font-weight:700;color:var(--red)}.pl.sel{background:var(--soft)}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:650;margin:12px 0 7px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.rate button{border:1px solid var(--bd);border-radius:12px;text-align:center;padding:8px 2px;font-size:12px;font-weight:650;min-height:44px}.rate button small{display:block;font-size:10px;color:var(--mut);font-weight:400}.rate button.on{border-color:var(--red);background:var(--soft)}
.toast{position:absolute;left:16px;right:16px;bottom:20px;background:#15171b;color:#fff;border-radius:14px;padding:11px 14px;font-size:12px;line-height:1.4;z-index:9}
</style></head><body>
<div class="top"><h1>Membuat post Feeds — 3 opsi</h1><p>Semua layar bisa diklik. Tiap opsi menjawab masalah form lama: terlalu banyak kotak, harus memilih "jenis" dulu, dan semua tampil sekaligus.</p>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-o="0">1 · Mulai dari foto</button><button role="tab" aria-selected="false" data-o="1">2 · Satu kolom</button><button role="tab" aria-selected="false" data-o="2">3 · Dari Agenda</button></div></div>
<div class="note" id="note"></div>
<div class="phone" id="phone"></div>
<script>
const g=id=>document.getElementById(id);
const COL=['#c2410c','#0f766e','#4338ca','#a16207','#be185d','#334155','#0e7490','#7c2d12','#4d7c0f'];
const N=['<b>1 · Mulai dari foto.</b> Seperti Instagram: langkah 1 pilih foto dari galeri, langkah 2 beri keterangan satu baris. Jenis post ditentukan otomatis (ada foto = Cerita). Cocok untuk cerita visual, bukan tanya-jawab.','<b>2 · Satu kolom.</b> Seperti menulis catatan: hanya satu area teks. Tujuan diisi otomatis dari trip aktif, jenis ditebak dari isi ("?" jadi Tanya), tempat disarankan dari Agenda. Bilah ikon di bawah untuk foto, tempat, trip. Paling cepat untuk tanya dan tips teks.','<b>3 · Dari Agenda.</b> Tanpa mengetik dari nol: pilih tempat yang sudah ada di Agenda trip, beri kesan lewat tag cepat (Antre, Murah, Worth it), tambah satu baris bila mau. Kualitas tips terjaga karena terstruktur, dan tiap post otomatis punya tempat untuk "Simpan ke Agenda".'];
const st={o:0,sel:[],txt:'',ph:false,pl:false,trip:false,pick:-1,tags:[],line:'',step:1,cap:'',kind:'Cerita',done:false};
function reset(){Object.assign(st,{sel:[],txt:'',ph:false,pl:false,trip:false,pick:-1,tags:[],line:'',step:1,cap:'',kind:'Cerita',done:false})}
const me=`<div class="me"><span class="av">R</span><div><strong>Rani · Jakarta</strong><small>Tampil ke semua traveler</small></div></div>`;
const privacy=`<div class="priv">Lokasi tepat dan tanggal berangkatmu tidak ditampilkan. Post pertamamu ditinjau tim dulu.</div>`;
function v0(){const ph=g('phone');
 if(st.step==1)return `<div class="bar"><button class="x" data-a="close" aria-label="Tutup">✕</button><h2>Pilih foto</h2><button class="send" data-a="next" ${st.sel.length?'':'disabled'}>Lanjut</button></div><div class="body" style="padding:0"><div class="seg" style="padding:0 16px"><button class="on">Terbaru</button><button>Album</button><button>Foto trip</button></div><div class="grid">${COL.concat(COL).map((c,i)=>{const n=st.sel.indexOf(i)+1;return `<button class="gp ${n?'sel':''}" data-n="${n}" data-i="${i}" style="background:${c}" aria-label="Foto ${i+1}">Foto</button>`}).join('')}</div></div><div class="priv">Pilih sampai 4 foto. Foto diperkecil dan data lokasi (EXIF) dihapus sebelum diunggah.</div>`;
 return `<div class="bar"><button class="x" data-a="back" aria-label="Kembali">‹</button><h2>Post baru</h2><button class="send" data-a="send" ${st.cap?'':'disabled'}>Kirim</button></div><div class="body">${me}<div class="prev" style="background:${COL[st.sel[0]||0]}">${st.sel.length} foto<span class="pc">📍 Ichiran Shibuya · dari Agenda</span></div><button class="cap ${st.cap?'f':''}" data-a="cap">${st.cap||'Tulis keterangan singkat…'}</button><div style="margin-top:10px"><span class="chip on">Jepang</span><span class="chip">+ Tempat</span><span class="chip">+ Trip</span></div></div>${privacy}`}
function v1(){const q=/\?\s*$/.test(st.txt);const kind=!st.txt?'Cerita':q?'Tanya':st.pl?'Tips tempat':'Cerita';
 return `<div class="bar"><button class="x" data-a="close" aria-label="Tutup">✕</button><h2>Post baru</h2><button class="send" data-a="send" ${st.txt?'':'disabled'}>Kirim</button></div><div class="body">${me}<div><span class="chip on">Jepang · dari trip aktif</span><span class="chip ${st.txt?'red':''}">Jenis: ${kind}</span></div><textarea class="ta" id="ta" placeholder="Bagikan tips, cerita, atau tanya traveler lain…" maxlength="500">${st.txt}</textarea><button class="chip red" data-a="fill" style="min-height:30px">Isi contoh teks</button>
 ${st.pl?'':`<div class="sug"><b>Tambah tempat dari Agenda?</b>Ichiran Shibuya · Hari 2<button data-a="pl">Tambahkan</button></div>`}
 ${st.ph?`<div class="prev" style="height:120px;background:${COL[0]}">1 foto</div>`:''}${st.pl?`<span class="chip ok">📍 Ichiran Shibuya ✕</span>`:''}${st.trip?`<span class="chip ok">Tokyo 5 hari ✕</span>`:''}</div>
 <div class="tool"><button class="${st.ph?'on':''}" data-a="ph">▣ Foto</button><button class="${st.pl?'on':''}" data-a="pl">📍 Tempat</button><button class="${st.trip?'on':''}" data-a="trip">✈ Trip</button><span class="cnt">${st.txt.length}/500</span></div>${privacy}`}
function v2(){const places=[['Ichiran Shibuya','Hari 2 · Makan','#c2410c'],['Shibuya Sky','Hari 2 · Foto','#0f766e'],['Mega Don Quijote','Hari 3 · Belanja','#4338ca']];
 const T=[['Antre','lama'],['Murah','hemat'],['Worth it','layak'],['Ramai','padat'],['Enak','rasa'],['Sepi','tenang']];
 if(st.pick<0)return `<div class="bar"><button class="x" data-a="close" aria-label="Tutup">✕</button><h2>Bagikan dari perjalananmu</h2><span style="width:36px"></span></div><div class="body"><div class="lbl" style="margin-top:2px">Tempat di Agenda · Tokyo 5 hari</div>${places.map((p,i)=>`<button class="pl" data-pk="${i}"><span class="th" style="background:${p[2]}">${p[1].split(' · ')[1]}</span><span><strong>${p[0]}</strong><small>${p[1]}</small></span><span class="go">Bagikan</span></button>`).join('')}<div class="lbl">Atau</div><button class="pl" data-a="free"><span class="th" style="background:#334155">✎</span><span><strong>Tulis bebas</strong><small>Cerita atau pertanyaan tanpa tempat</small></span></button></div>${privacy}`;
 const p=places[st.pick]||places[0];
 return `<div class="bar"><button class="x" data-a="back" aria-label="Kembali">‹</button><h2>Tips tempat</h2><button class="send" data-a="send" ${st.tags.length?'':'disabled'}>Kirim</button></div><div class="body">${me}<div class="pl sel" style="cursor:default"><span class="th" style="background:${p[2]}">${p[1].split(' · ')[1]}</span><span><strong>${p[0]}</strong><small>${p[1]}</small></span></div><div class="lbl" style="margin-top:6px">Kesanmu (pilih 1 sampai 3)</div><div class="rate">${T.map(t=>`<button class="${st.tags.includes(t[0])?'on':''}" data-tg="${t[0]}">${t[0]}<small>${t[1]}</small></button>`).join('')}</div><div class="lbl">Satu baris tips (opsional)</div><button class="cap ${st.line?'f':''}" data-a="line">${st.line||'Mis. datang jam 15.00 supaya tidak antre'}</button><div style="margin-top:10px"><button class="chip ${st.ph?'on':''}" data-a="ph">▣ Tambah foto</button></div></div>${privacy}`}
function render(){const ph=g('phone');ph.innerHTML=[v0,v1,v2][st.o]()+(st.done?`<div class="toast">Terkirim. Postingan pertamamu ditinjau dulu, biasanya kurang dari 1 jam.</div>`:'');bind();
 document.querySelectorAll('.tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j==st.o));g('note').innerHTML=N[st.o]}
function bind(){const ph=g('phone');
 ph.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=st.sel.indexOf(i);if(k>=0)st.sel.splice(k,1);else if(st.sel.length<4)st.sel.push(i);render()});
 ph.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{st.pick=+b.dataset.pk;render()});
 ph.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const t=b.dataset.tg,k=st.tags.indexOf(t);if(k>=0)st.tags.splice(k,1);else if(st.tags.length<3)st.tags.push(t);render()});
 const ta=g('ta');if(ta)ta.oninput=()=>{st.txt=ta.value;const s=ph.querySelector('.send'),c=ph.querySelector('.cnt');s.disabled=!st.txt;c.textContent=st.txt.length+'/500';const kind=!st.txt?'Cerita':/\?\s*$/.test(st.txt)?'Tanya':st.pl?'Tips tempat':'Cerita';ph.querySelector('.chip.red,.chip.on+.chip').textContent='Jenis: '+kind};
 const A={close:()=>{reset();render()},next:()=>{st.step=2;render()},back:()=>{if(st.o==0)st.step=1;else st.pick=-1;render()},cap:()=>{st.cap='Datang jam 15.00 langsung masuk, jam 19.00 antre 40 menit.';render()},
  send:()=>{st.done=true;render();setTimeout(()=>{reset();render()},2600)},fill:()=>{st.txt='Ichiran Shibuya: datang jam 15.00 langsung masuk, jam 19.00 antre 40 menit.';render()},
  ph:()=>{st.ph=!st.ph;render()},pl:()=>{st.pl=!st.pl;render()},trip:()=>{st.trip=!st.trip;render()},line:()=>{st.line='Datang jam 15.00 supaya tidak antre.';render()},free:()=>{st.o=1;render()}};
 ph.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>A[b.dataset.a]&&A[b.dataset.a]())}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{reset();st.o=+b.dataset.o;render()});
render();
</script></body></html>
