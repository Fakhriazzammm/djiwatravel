<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore + Feeds — 3 tata letak</title><style>
:root{--bg:#f3f4f6;--fg:#15171b;--mut:#666a73;--bd:#e3e4e7;--red:#d32f2f;--soft:#fbe5e4;--ok:#17803d}
*{box-sizing:border-box}body{margin:0;background:#e8e9ec;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.top{max-width:470px;margin:0 auto 10px}.top h1{font-size:18px;margin:0 0 4px}.top p{font-size:12px;color:var(--mut);margin:0 0 10px;line-height:1.5}
.tabs{display:flex;gap:6px}.tabs button{flex:1;border-radius:12px;padding:9px 4px;background:#fff;font-size:12px;font-weight:650;text-align:center}.tabs button[aria-selected=true]{background:var(--fg);color:#fff}
.note{max-width:470px;margin:0 auto 12px;font-size:12px;line-height:1.55;color:var(--mut);min-height:70px}
.phone{position:relative;width:390px;max-width:100%;height:800px;margin:auto;background:var(--bg);border:1px solid var(--bd);border-radius:26px;overflow:hidden}
.scr{position:absolute;inset:0;overflow:auto;padding:14px 16px 110px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.brand{font-size:10px;letter-spacing:.22em;font-weight:700;color:var(--red)}h2.t{font-size:22px;font-weight:750;margin:2px 0 0}.sub{font-size:12px;color:var(--mut);margin:2px 0 10px}
.search{display:flex;align-items:center;gap:8px;height:38px;border:1px solid var(--bd);background:#fff;border-radius:19px;padding:0 14px;font-size:13px;color:var(--mut)}
.ban{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:16px;padding:10px 14px;margin:10px 0 14px;width:100%}.ban strong{font-size:13px;display:block}.ban small{font-size:11px;color:var(--mut)}.ban i{color:var(--red);font-style:normal;font-size:16px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.sh h3{margin:0;font-size:16px;font-weight:750}.sh span{font-size:12px;color:var(--mut)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;margin-bottom:16px}.sv{text-align:center;position:relative;font-size:12px;font-weight:650}.sv img{width:40px;height:40px;object-fit:contain;display:block;margin:0 auto 4px}.sv em{display:block;font-style:normal;font-size:10px;color:var(--mut);font-weight:500;margin-top:2px}.sv .ok{display:inline-block;font-size:10px;font-weight:650;color:var(--red);background:var(--soft);border-radius:9px;padding:1px 7px;margin-top:2px}.sv .ch{position:absolute;top:0;right:12px;font-size:11px;color:var(--mut)}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:650;margin:0 0 7px;display:flex;justify-content:space-between;align-items:center}.lbl b{color:var(--red);text-transform:none;letter-spacing:0;min-height:28px;display:inline-flex;align-items:center}
.chips{display:flex;gap:6px;overflow:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}.chip{flex-shrink:0;min-height:32px;padding:0 12px;border-radius:16px;background:#fff;border:1px solid var(--bd);font-size:12px;font-weight:600;display:inline-flex;align-items:center}.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px}.ph{display:flex;gap:8px;align-items:center}.ph div{flex:1;min-width:0}.ph strong{font-size:13px;display:block}.ph small{font-size:11px;color:var(--mut)}
.badge{font-size:10px;font-weight:650;background:var(--soft);color:var(--red);border-radius:8px;padding:2px 7px}.badge.w{background:#fff3d6;color:#92600a}
.card p{font-size:13px;line-height:1.45;margin:6px 0}.img{border-radius:12px;margin:8px 0;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;height:120px}.pl{font-size:11px;color:var(--mut)}.pl b{color:var(--red)}
.acts{display:flex;gap:6px;font-size:12px;color:var(--mut);margin-top:4px}.acts span{min-height:30px;display:flex;align-items:center;padding-right:10px}
.pend{border:1.5px dashed #d9a441;background:#fffaf0}
.sg{border:1.5px solid var(--red)}.sg .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);font-weight:700}.sg h4{font-size:14px;margin:3px 0 2px}.sg .s{font-size:11px;color:var(--mut)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}.tg button{min-height:40px;border:1px solid var(--bd);border-radius:12px;font-size:12px;font-weight:650;text-align:center}.tg button.on{border-color:var(--red);background:var(--soft);color:var(--red)}
.ln,.ta{width:100%;border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font:inherit;font-size:13px;margin-top:8px;color:var(--fg);outline:0}.ta{min-height:80px;resize:none;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.go{min-height:34px;padding:0 16px;border-radius:17px;background:var(--red);color:#fff;font-size:13px;font-weight:650}.go[disabled]{opacity:.35}.lk{font-size:12px;font-weight:650;color:var(--mut);min-height:32px}
.fake{flex:1;min-height:38px;border-radius:19px;background:var(--bg);padding:0 14px;font-size:13px;color:var(--mut);display:flex;align-items:center}
.seg{display:flex;background:#e6e7ea;border-radius:12px;padding:3px;margin:10px 0 12px}.seg button{flex:1;text-align:center;min-height:34px;border-radius:10px;font-size:13px;font-weight:650;color:var(--mut)}.seg button.on{background:#fff;color:var(--fg);box-shadow:0 1px 4px #0001}.seg i{font-style:normal;background:var(--red);color:#fff;border-radius:8px;font-size:10px;padding:1px 6px;margin-left:5px}
.tab{position:absolute;left:14px;right:14px;bottom:12px;height:58px;background:#fff;border-radius:28px;display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--mut);box-shadow:0 2px 12px #0001;z-index:6}.tab .on{color:var(--red);font-weight:700}
.peek{position:absolute;left:10px;right:10px;bottom:78px;background:#fff;border-radius:20px;box-shadow:0 -2px 18px #0002;padding:8px 14px 12px;z-index:4;width:calc(100% - 20px)}.peek .gr{width:36px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 8px}.peek .hd{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}.peek .hd small{font-weight:500;color:var(--red);font-size:12px}.peek p{font-size:12px;color:var(--mut);margin:4px 0 0;line-height:1.4}
.full{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--bg);z-index:5;overflow:auto;padding:14px 16px 100px;border-radius:26px}.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;height:36px}.nav h2{font-size:17px;margin:0;flex:1}.ib{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#15171b;color:#fff;border-radius:14px;padding:11px 14px;font-size:12px;line-height:1.4;z-index:9}
</style></head><body>
<div class="top"><h1>Explore + Feeds — 3 tata letak</h1><p>Semua isi Explore tetap ada: pencarian, banner eSIM, dan grid "Kebutuhan perjalanan" dengan 8 layanan. Feeds ditambahkan tanpa menghapusnya. Gulir dan ketuk untuk mencoba.</p>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-o="0">1 · Menyambung ke bawah</button><button role="tab" aria-selected="false" data-o="1">2 · Segmen</button><button role="tab" aria-selected="false" data-o="2">3 · Panel mengintip</button></div></div>
<div class="note" id="note"></div>
<div class="phone" id="phone"></div>
<script>
const g=id=>document.getElementById(id);const C=['#c2410c','#0f766e','#4338ca'];
const IMG='../public/assets/explore/services/';
const SV=[['esim.svg','eSIM',1],['flight-plane-v1.png','Tiket',1],['attractions.svg','Aktivitas',0],['open-trip-v2.png','Open Trip',0],['baggage.svg','Bagasi',0],['personal-shopper.svg','Titip Belanja',1],['visa.svg','Visa',0],['travel-insurance.svg','Asuransi',0]];
const N=['<b>1 · Menyambung ke bawah.</b> Persis seperti sekarang, lalu Feeds sebagai bagian berikutnya setelah grid. Paling sederhana dan paling dekat dengan permintaan awal. Kelemahannya: Feeds berada di bawah lipatan layar, jadi harus digulir dulu.','<b>2 · Segmen.</b> Di bawah pencarian ada pilihan "Layanan | Feeds". Layanan (banner dan grid utuh) tampil dulu; Feeds sekali ketuk dengan lencana jumlah kabar baru. Layar tidak jadi panjang, tapi Feeds tidak terlihat kalau pengguna tidak mengetuk.','<b>3 · Panel mengintip.</b> Banner dan grid utuh, dan di atas tab bar ada panel kecil "Feeds traveler · 18 kabar baru" dengan satu post yang mengintip. Diketuk, panel naik jadi layar Feeds penuh. Terlihat tanpa menggulir dan tidak mengubah susunan Explore.'];
const st={o:0,tags:[],line:'',free:false,txt:'',sent:null,toast:false,seg:'Layanan',full:false,dis:false};
const reset=()=>Object.assign(st,{tags:[],line:'',free:false,txt:'',sent:null,toast:false,seg:'Layanan',full:false,dis:false});
const hdr=`<div class="brand">DJIWA TRAVEL</div><h2 class="t">Explore</h2><div class="sub">Mau pergi ke mana?</div><div class="search">⌕ Cari Singapura</div>`;
const ban=`<button class="ban"><span><strong>Bingung pilih paket eSIM?</strong><small>Temukan paket yang cocok untuk perjalananmu.</small></span><i>›</i></button>`;
const grid=`<div class="sh"><h3>Kebutuhan perjalanan</h3><span>Layanan</span></div><div class="svc">${SV.map(s=>`<div class="sv">${s[2]&&s[1]!='Aktivitas'?'<span class="ch">›</span>':''}<img src="${IMG+s[0]}" alt="">${s[1]}${s[2]?'<span class="ok">● Tersedia</span>':'<em>Segera hadir</em>'}</div>`).join('')}</div>`;
const post=(n,i,w,k,b,img,pl)=>`<div class="card"><div class="ph"><span class="av" style="background:${C[i]}">${n[0]}</span><div><strong>${n}</strong><small>${w}</small></div><span class="badge">${k}</span></div><p>${b}</p>${img?`<div class="img" style="background:${img}">Foto</div>`:''}${pl?`<div class="pl">📍 ${pl} · <b>Simpan ke Agenda</b></div>`:''}<div class="acts"><span>♡ 48</span><span>💬 12</span><span>Simpan</span></div></div>`;
const feed=post('Rani',0,'Jakarta · 2 jam lalu','Jepang','Ramen Ichiran Shibuya antre 40 menit jam 19.00, datang jam 15.00 langsung masuk.',C[0],'Ichiran Shibuya')+post('Dimas',1,'Surabaya · 5 jam lalu','Tanya','JR Pass atau tiket satuan untuk 5 hari Kyoto–Osaka?')+post('Sari',2,'Bandung · Kemarin','Trip','Itinerary 6 hari Seoul – Busan, budget Rp 12 jt per orang.',C[1]);
function composer(){const T=['Antre','Murah','Worth it','Ramai','Enak','Sepi'];
 if(st.free)return `<div class="card"><div class="row"><span class="av" style="background:#c2410c">R</span><div><strong style="font-size:13px">Rani · Jakarta</strong><div style="font-size:11px;color:var(--mut)">Jepang · dari trip aktif</div></div></div><textarea class="ta" id="ta" maxlength="500" placeholder="Bagikan tips, cerita, atau tanya traveler lain…">${st.txt}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="lk" data-a="cancel">Batal</button><button class="go" id="go" data-a="send" ${st.txt?'':'disabled'}>Kirim</button></div></div>`;
 if(st.dis)return `<div class="card"><div class="row"><span class="av" style="background:#c2410c">R</span><button class="fake" data-a="free">Bagikan tips atau tanya traveler…</button></div></div>`;
 return `<div class="card sg"><div class="k">Dari Agendamu</div><h4>Kemarin kamu ke Ichiran Shibuya. Bagikan tipsnya?</h4><div class="s">Tokyo 5 hari · Hari 2 · Makan</div><div class="tg">${T.map(t=>`<button class="${st.tags.includes(t)?'on':''}" data-tg="${t}">${t}</button>`).join('')}</div>${st.tags.length?`<input class="ln" id="ln" maxlength="140" placeholder="Satu baris tips (opsional)" value="${st.line}"><div class="row" style="justify-content:space-between;margin-top:8px"><span style="font-size:11px;color:var(--mut)">Tampil sebagai Rani · Jakarta</span><button class="go" data-a="send">Kirim tips</button></div>`:`<div class="row" style="justify-content:space-between;margin-top:6px"><button class="lk" data-a="free">Tulis bebas</button><button class="lk" data-a="dis">Bukan sekarang</button></div>`}</div>`}
const mine=()=>st.sent?`<div class="card pend"><div class="ph"><span class="av" style="background:#c2410c">R</span><div><strong>Rani · kamu</strong><small>Baru saja</small></div><span class="badge w">Sedang ditinjau</span></div><p>${st.sent}</p><div class="pl">Hanya kamu yang melihat ini sampai disetujui (biasanya kurang dari 1 jam).</div></div>`:'';
const chips=`<div class="chips">${['Untuk kamu','Jepang','Korea','Tips','Tanya'].map((c,i)=>`<span class="chip ${i?'':'on'}">${c}</span>`).join('')}</div>`;
const feedBlock=()=>chips+composer()+mine()+feed;
const tab=`<div class="tab"><span>Beranda</span><span class="on">Jelajah</span><span>Perjalanan</span><span>Dompet</span><span>Profil</span></div>`;
function v0(){return `<div class="scr">${hdr}${ban}${grid}<div class="lbl">Feeds traveler <b>Lihat semua</b></div>${feedBlock()}<button class="chip" style="width:100%;justify-content:center;min-height:38px;border-radius:12px">Lihat semua post</button></div>`+tab}
function v1(){return `<div class="scr">${hdr}<div class="seg" role="tablist">${['Layanan','Feeds'].map(s=>`<button class="${st.seg==s?'on':''}" data-seg="${s}">${s}${s=='Feeds'?'<i>18</i>':''}</button>`).join('')}</div>${st.seg=='Layanan'?`${ban}${grid}<button class="card" data-seg="Feeds" style="width:100%;display:block"><div class="lbl" style="margin:0 0 4px">Feeds traveler <b>Buka</b></div><div style="font-size:12px;color:var(--mut);line-height:1.4"><b style="color:var(--fg)">Rani:</b> Ramen Ichiran jam 15.00 langsung masuk, jam 19.00 antre 40 menit.</div></button>`:feedBlock()}</div>`+tab}
function v2(){const peek=`<button class="peek" data-a="full"><div class="gr"></div><div class="hd">Feeds traveler <small>18 kabar baru ↑</small></div><p><b style="color:var(--fg)">Rani:</b> Ramen Ichiran jam 15.00 langsung masuk, jam 19.00 antre 40 menit.</p></button>`;
 const full=st.full?`<div class="full"><div class="nav"><button class="ib" data-a="close" aria-label="Tutup">⌄</button><h2>Feeds traveler</h2><button class="ib" aria-label="Cari">⌕</button></div>${feedBlock()}</div>`:'';
 return `<div class="scr" style="padding-bottom:190px">${hdr}${ban}${grid}</div>${st.full?'':peek}${full}`+tab}
function render(){g('phone').innerHTML=[v0,v1,v2][st.o]()+(st.toast?'<div class="toast">Terkirim. Postingan pertamamu ditinjau dulu.</div>':'');
 document.querySelectorAll('.tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j==st.o));g('note').innerHTML=N[st.o];bind()}
function bind(){const ph=g('phone');
 const ta=g('ta');if(ta){ta.oninput=()=>{st.txt=ta.value;g('go').disabled=!st.txt};if(!st.txt)ta.focus()}
 const ln=g('ln');if(ln)ln.oninput=()=>st.line=ln.value;
 ph.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const t=b.dataset.tg,k=st.tags.indexOf(t);if(k>=0)st.tags.splice(k,1);else if(st.tags.length<3)st.tags.push(t);render()});
 ph.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{st.seg=b.dataset.seg;render()});
 const A={free:()=>{st.free=true;render()},cancel:()=>{st.free=false;st.txt='';render()},dis:()=>{st.dis=true;render()},full:()=>{st.full=true;render()},close:()=>{st.full=false;render()},
  send:()=>{st.sent=st.free?st.txt:`Ichiran Shibuya · ${st.tags.join(', ')}${st.line?' — '+st.line:''}`;st.free=false;st.txt='';st.tags=[];st.line='';st.toast=true;render();setTimeout(()=>{st.toast=false;render()},3000)}};
 ph.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>A[b.dataset.a]&&A[b.dataset.a]())}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{reset();st.o=+b.dataset.o;render()});
render();
</script></body></html>
