<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore menyatu dengan timeline — 3 opsi</title><style>
:root{--bg:#f3f4f6;--fg:#15171b;--mut:#666a73;--bd:#e3e4e7;--red:#d32f2f;--soft:#fbe5e4;--ok:#17803d}
*{box-sizing:border-box}body{margin:0;background:#e8e9ec;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:inherit}button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.top{max-width:470px;margin:0 auto 10px}.top h1{font-size:18px;margin:0 0 4px}.top p{font-size:12px;color:var(--mut);margin:0 0 10px;line-height:1.5}
.tabs{display:flex;gap:6px}.tabs button{flex:1;border-radius:12px;padding:9px 4px;background:#fff;font-size:12px;font-weight:650;text-align:center}.tabs button[aria-selected=true]{background:var(--fg);color:#fff}
.note{max-width:470px;margin:0 auto 12px;font-size:12px;line-height:1.55;color:var(--mut);min-height:70px}
.phone{position:relative;width:390px;max-width:100%;height:800px;margin:auto;background:var(--bg);border:1px solid var(--bd);border-radius:26px;overflow:hidden}
.scr{position:absolute;inset:0;overflow:auto;padding:0 16px 110px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.stick{position:sticky;top:0;z-index:3;background:var(--bg);margin:0 -16px;padding:12px 16px 8px}
.brand{font-size:10px;letter-spacing:.22em;font-weight:700;color:var(--red)}h2.t{font-size:22px;font-weight:750;margin:1px 0 8px}
.search{display:flex;align-items:center;gap:8px;height:38px;border:1px solid var(--bd);background:#fff;border-radius:19px;padding:0 14px;font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
.strip{display:flex;gap:2px;overflow:auto;margin:8px -16px 0;padding:0 12px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.st{flex-shrink:0;width:62px;text-align:center;font-size:10.5px;font-weight:650;padding:4px 0;border-radius:12px;position:relative}.st img{width:30px;height:30px;object-fit:contain;display:block;margin:0 auto 2px}.st.off{opacity:.5}.st.on{background:#fff;box-shadow:0 1px 5px #0001}.st i{position:absolute;top:4px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px}.ph{display:flex;gap:8px;align-items:center}.ph div{flex:1;min-width:0}.ph strong{font-size:13px;display:block}.ph small{font-size:11px;color:var(--mut)}
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}.av.dj{background:var(--red);font-size:13px}
.badge{font-size:10px;font-weight:650;background:var(--soft);color:var(--red);border-radius:8px;padding:2px 7px}.badge.g{background:#eceef1;color:var(--mut)}
.card p{font-size:13px;line-height:1.45;margin:6px 0}.img{border-radius:12px;margin:8px 0;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;height:120px}.pl{font-size:11px;color:var(--mut)}.pl b{color:var(--red)}
.acts{display:flex;gap:6px;font-size:12px;color:var(--mut);margin-top:4px}.acts span{min-height:30px;display:flex;align-items:center;padding-right:10px}
.fake{flex:1;min-height:38px;border-radius:19px;background:var(--bg);padding:0 14px;font-size:13px;color:var(--mut);display:flex;align-items:center}
.sg{border:1.5px solid var(--red)}.sg .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);font-weight:700}.sg h4{font-size:14px;margin:3px 0 2px}.sg .s{font-size:11px;color:var(--mut)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 2px}.tg button{min-height:38px;border:1px solid var(--bd);border-radius:12px;font-size:12px;font-weight:650;text-align:center}.tg button.on{border-color:var(--red);background:var(--soft);color:var(--red)}
.go{min-height:34px;padding:0 16px;border-radius:17px;background:var(--red);color:#fff;font-size:13px;font-weight:650}.lk{font-size:12px;font-weight:650;color:var(--mut);min-height:30px}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 2px}.sv{text-align:center;font-size:11.5px;font-weight:650}.sv img{width:36px;height:36px;object-fit:contain;display:block;margin:0 auto 3px}.sv em{display:block;font-style:normal;font-size:10px;color:var(--mut);font-weight:500}.sv .ok{display:inline-block;font-size:10px;font-weight:650;color:var(--red);background:var(--soft);border-radius:9px;padding:0 7px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.sh h3{margin:0;font-size:15px;font-weight:750}.sh span{font-size:12px;color:var(--mut)}
.promo{background:var(--soft)}.promo .cta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:700;color:var(--red)}
.prod{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 10px;margin-top:8px}.prod img{width:34px;height:34px;object-fit:contain}.prod strong{font-size:13px;display:block}.prod small{font-size:11px;color:var(--mut)}.prod .go{margin-left:auto}
.tab{position:absolute;left:14px;right:14px;bottom:12px;height:58px;background:#fff;border-radius:28px;display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--mut);box-shadow:0 2px 12px #0001;z-index:6}.tab .on{color:var(--red);font-weight:700}
.dayl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:650;margin:4px 0 7px}
</style></head><body>
<div class="top"><h1>Explore menyatu dengan timeline — 3 opsi</h1><p>Explore didesain ulang agar layanan dan Feeds terasa satu aliran kartu, bukan dua halaman yang ditempel. Semua isi lama tetap ada: pencarian, banner eSIM, dan 8 layanan. Gulir dan ketuk.</p>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-o="0">1 · Rak layanan</button><button role="tab" aria-selected="false" data-o="1">2 · Semua kartu</button><button role="tab" aria-selected="false" data-o="2">3 · Layanan = filter</button></div></div>
<div class="note" id="note"></div>
<div class="phone" id="phone"></div>
<script>
const g=id=>document.getElementById(id);const C=['#c2410c','#0f766e','#4338ca'];
const IMG='../public/assets/explore/services/';
const icon=f=>IMG+f;
const SV=[['esim','esim.svg','eSIM',1],['tiket','flight-plane-v1.png','Tiket',1],['aktivitas','attractions.svg','Aktivitas',0],['open','open-trip-v2.png','Open Trip',0],['bagasi','baggage.svg','Bagasi',0],['titip','personal-shopper.svg','Titip',1],['visa','visa.svg','Visa',0],['asuransi','travel-insurance.svg','Asuransi',0]];
const N=['<b>1 · Rak layanan.</b> Grid 2×4 diringkas jadi satu baris ikon yang menempel di atas bersama pencarian, dan selalu terlihat saat menggulir. Banner eSIM menjadi kartu "Dari Djiwa" di dalam timeline. Timeline langsung terlihat tanpa menggulir. Ketuk ikon untuk membuka layanan.','<b>2 · Semua kartu.</b> Halaman jadi satu aliran kartu dengan gaya yang sama: kartu saran Agenda, kartu "Kebutuhan perjalanan" (grid 4×2 utuh), kartu eSIM dari Djiwa, lalu post traveler yang diselingi kartu layanan kontekstual. Paling menyatu dan tetap membawa grid penuh.','<b>3 · Layanan = filter.</b> Rak ikon layanan berfungsi sebagai filter timeline. "Semua" menampilkan campuran. Ketuk eSIM, timeline menampilkan kartu eSIM dari Djiwa dan post traveler tentang eSIM. Layanan dan percakapan saling menguatkan. Paling berani, tapi butuh penandaan layanan di tiap post.'];
const st={o:0,f:'semua',tags:[]};
const hdr=`<div class="brand">DJIWA TRAVEL</div><h2 class="t">Explore</h2><div class="search">⌕ Cari Singapura</div>`;
const tab=`<div class="tab"><span>Beranda</span><span class="on">Jelajah</span><span>Perjalanan</span><span>Dompet</span><span>Profil</span></div>`;
const post=(n,i,w,k,b,img,pl)=>`<div class="card"><div class="ph"><span class="av" style="background:${C[i]}">${n[0]}</span><div><strong>${n}</strong><small>${w}</small></div><span class="badge g">${k}</span></div><p>${b}</p>${img?`<div class="img" style="background:${img}">Foto</div>`:''}${pl?`<div class="pl">📍 ${pl} · <b>Simpan ke Agenda</b></div>`:''}<div class="acts"><span>♡ 48</span><span>💬 12</span><span>Simpan</span></div></div>`;
const P={ramen:post('Rani',0,'Jakarta · 2 jam lalu','Jepang','Ramen Ichiran Shibuya antre 40 menit jam 19.00, datang jam 15.00 langsung masuk.',C[0],'Ichiran Shibuya'),tanya:post('Dimas',1,'Surabaya · 5 jam lalu','Tanya','JR Pass atau tiket satuan untuk 5 hari Kyoto–Osaka?'),trip:post('Sari',2,'Bandung · Kemarin','Trip','Itinerary 6 hari Seoul – Busan, budget Rp 12 jt per orang.',C[1]),
 esim:post('Tia',2,'Bandung · 3 jam lalu','eSIM','eSIM 10 hari di Jepang, sinyal stabil sampai di Shinkansen. Aktifkan sebelum mendarat.'),tiket:post('Bayu',1,'Jakarta · 1 jam lalu','Tiket','Harga CGK–HND paling murah hari Selasa, turun Rp 600 rb dari Jumat.'),titip:post('Lina',0,'Bogor · Kemarin','Titip Belanja','Titip Uniqlo Ginza sampai 7 hari, tanpa selisih dari harga di toko.')};
const composer=()=>`<div class="card sg"><div class="k">Dari Agendamu</div><h4>Kemarin kamu ke Ichiran Shibuya. Bagikan tipsnya?</h4><div class="s">Tokyo 5 hari · Hari 2 · Makan</div><div class="tg">${['Antre','Murah','Worth it'].map(t=>`<button class="${st.tags.includes(t)?'on':''}" data-tg="${t}">${t}</button>`).join('')}</div>${st.tags.length?`<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="go">Kirim tips</button></div>`:`<div class="row" style="justify-content:space-between;margin-top:4px"><button class="lk">Tulis bebas</button><button class="lk">Bukan sekarang</button></div>`}</div>`;
const esimPromo=`<div class="card promo"><div class="ph"><span class="av dj">D</span><div><strong>Djiwa Travel</strong><small>Untuk perjalananmu</small></div><span class="badge">eSIM</span></div><p><b>Bingung pilih paket eSIM?</b><br><span style="color:var(--mut)">Temukan paket yang cocok untuk perjalananmu.</span></p><div class="cta"><span>Cari paket</span><span>›</span></div></div>`;
const svcCard=`<div class="card"><div class="sh"><h3>Kebutuhan perjalanan</h3><span>Layanan</span></div><div class="svc">${SV.map(s=>`<div class="sv"><img src="${icon(s[1])}" alt="">${s[2]}${s[3]?'<span class="ok">Tersedia</span>':'<em>Segera hadir</em>'}</div>`).join('')}</div></div>`;
function v0(){return `<div class="scr"><div class="stick">${hdr}<div class="strip">${SV.map(s=>`<button class="st ${s[3]?'':'off'}"><img src="${icon(s[1])}" alt="">${s[2]}</button>`).join('')}</div></div>${esimPromo}${composer()}${P.ramen}${P.tanya}${P.trip}</div>`+tab}
function v1(){return `<div class="scr"><div class="stick">${hdr}</div>${composer()}${svcCard}${esimPromo}${P.ramen}<div class="card promo" style="background:#fff;border:1px solid var(--bd)"><div class="ph"><span class="av dj">D</span><div><strong>Djiwa Travel</strong><small>Layanan baru</small></div><span class="badge">Titip Belanja</span></div><p>Mau Uniqlo atau Longchamp dari Jepang? Kami belikan dan kirim ke rumah.</p><div class="cta"><span>Lihat produk</span><span>›</span></div></div>${P.tanya}${P.trip}</div>`+tab}
function v2(){const f=st.f;const data={
 semua:[esimPromo,composer(),P.ramen,P.esim,P.tanya,P.tiket,P.trip],
 esim:[`<div class="card promo"><div class="ph"><span class="av dj">D</span><div><strong>eSIM Djiwa</strong><small>Internet saat tiba</small></div><span class="badge">eSIM</span></div><p><b>Bingung pilih paket eSIM?</b><br><span style="color:var(--mut)">Temukan paket yang cocok untuk perjalananmu.</span></p><div class="prod" style="background:#fff"><img src="${icon('esim.svg')}" alt=""><span><strong>eSIM Jepang · 10 hari</strong><small>mulai Rp 89.000</small></span><button class="go">Beli</button></div></div>`,P.esim,P.tanya],
 tiket:[`<div class="card promo"><div class="ph"><span class="av dj">D</span><div><strong>Tiket Djiwa</strong><small>Harga tercatat, bukan real time</small></div><span class="badge">Tiket</span></div><p><b>CGK → HND</b> dari <b>Rp 4,1 jt</b> · Pantau harga</p><div class="cta"><span>Cari tiket</span><span>›</span></div></div>`,P.tiket],
 titip:[`<div class="card promo"><div class="ph"><span class="av dj">D</span><div><strong>Titip Belanja</strong><small>Dari toko resmi Jepang</small></div><span class="badge">Titip</span></div><p>Uniqlo, GU, dan tas Longchamp dikirim ke rumah.</p><div class="cta"><span>Lihat produk</span><span>›</span></div></div>`,P.titip]}[f]||[`<div class="card" style="text-align:center;color:var(--mut);font-size:12px">Layanan ini segera hadir. <b style="color:var(--red)">Beri tahu saya</b></div>`];
 return `<div class="scr"><div class="stick">${hdr}<div class="strip"><button class="st ${f=='semua'?'on':''}" data-f="semua"><span style="display:block;height:30px;font-size:15px;line-height:30px;font-weight:750">★</span>Semua</button>${SV.map(s=>`<button class="st ${s[3]?'':'off'} ${f==s[0]?'on':''}" data-f="${s[0]}"><img src="${icon(s[1])}" alt="">${s[2]}</button>`).join('')}</div></div>${data.join('')}</div>`+tab}
function render(){const ph=g('phone');const sc=ph.querySelector('.scr');const top=sc?sc.scrollTop:0;ph.innerHTML=[v0,v1,v2][st.o]();ph.querySelector('.scr').scrollTop=top;
 document.querySelectorAll('.tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j==st.o));g('note').innerHTML=N[st.o];
 ph.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const t=b.dataset.tg,k=st.tags.indexOf(t);if(k>=0)st.tags.splice(k,1);else st.tags.push(t);render()});
 ph.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.f=b.dataset.f;render();ph.querySelector('.scr').scrollTop=0})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{st.o=+b.dataset.o;st.f='semua';st.tags=[];render();g('phone').querySelector('.scr').scrollTop=0});
render();
</script></body></html>
