<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post langsung di timeline — 3 opsi</title><style>
:root{--bg:#f3f4f6;--fg:#15171b;--mut:#666a73;--bd:#e3e4e7;--red:#ed2935;--soft:#fbe5e4;--ok:#17803d}
*{box-sizing:border-box}body{margin:0;background:#e8e9ec;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.top{max-width:470px;margin:0 auto 10px}.top h1{font-size:18px;margin:0 0 4px}.top p{font-size:12px;color:var(--mut);margin:0 0 10px;line-height:1.5}
.tabs{display:flex;gap:6px}.tabs button{flex:1;border-radius:12px;padding:9px 4px;background:#fff;font-size:12px;font-weight:650;text-align:center}.tabs button[aria-selected=true]{background:var(--fg);color:#fff}
.note{max-width:470px;margin:0 auto 12px;font-size:12px;line-height:1.55;color:var(--mut);min-height:62px}
.phone{position:relative;width:390px;max-width:100%;height:780px;margin:auto;background:var(--bg);border:1px solid var(--bd);border-radius:26px;overflow:hidden}
.scr{position:absolute;inset:0;overflow:auto;padding:14px 16px 110px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;height:36px}.nav h2{font-size:17px;margin:0;flex:1}.ib{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px}
.chips{display:flex;gap:6px;overflow:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}.chip{flex-shrink:0;min-height:32px;padding:0 12px;border-radius:16px;background:#fff;border:1px solid var(--bd);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px}
.ph{display:flex;gap:8px;align-items:center}.ph div{flex:1;min-width:0}.ph strong{font-size:13px;display:block}.ph small{font-size:11px;color:var(--mut)}
.badge{font-size:10px;font-weight:650;background:var(--soft);color:var(--red);border-radius:8px;padding:2px 7px}.badge.w{background:#fff3d6;color:#92600a}
.card p{font-size:13px;line-height:1.45;margin:6px 0}.img{border-radius:12px;margin:8px 0;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;height:120px}.pl{font-size:11px;color:var(--mut)}.pl b{color:var(--red)}
.acts{display:flex;gap:6px;font-size:12px;color:var(--mut);margin-top:4px}.acts span{min-height:30px;display:flex;align-items:center;padding-right:10px}
.pend{border:1.5px dashed #d9a441;background:#fffaf0}
.tabbar{position:absolute;left:14px;right:14px;bottom:12px;height:58px;background:#fff;border-radius:28px;display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--mut);box-shadow:0 2px 12px #0001;z-index:2}.tabbar .on{color:var(--red);font-weight:700}
/* v1 */
.fake{flex:1;min-height:38px;border-radius:19px;background:var(--bg);padding:0 14px;font-size:13px;color:var(--mut);display:flex;align-items:center}
.row{display:flex;gap:8px;align-items:center}.qa{display:flex;gap:6px;margin-top:10px}.qa button{flex:1;min-height:34px;border-radius:10px;background:var(--bg);font-size:12px;font-weight:650;text-align:center}
.ta{width:100%;min-height:84px;border:0;outline:0;resize:none;font:inherit;font-size:15px;line-height:1.45;background:none;color:var(--fg);padding:0;margin-top:8px}
.bar2{display:flex;gap:6px;align-items:center;border-top:1px solid var(--bd);padding-top:8px;margin-top:6px}.bar2 .t{min-height:32px;padding:0 10px;border-radius:16px;background:var(--bg);font-size:12px;font-weight:650}.bar2 .t.on{background:var(--soft);color:var(--red)}.bar2 .sp{flex:1;font-size:11px;color:var(--mut);text-align:right}
.go{min-height:34px;padding:0 16px;border-radius:17px;background:var(--red);color:#fff;font-size:13px;font-weight:650}.go[disabled]{opacity:.35}
.cancel{min-height:34px;padding:0 10px;font-size:12px;font-weight:650;color:var(--mut)}
/* v2 */
.sg{border:1.5px solid var(--red);background:#fff}.sg .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);font-weight:700}.sg h3{font-size:14px;margin:3px 0 2px}.sg .s{font-size:11px;color:var(--mut)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}.tg button{min-height:40px;border:1px solid var(--bd);border-radius:12px;font-size:12px;font-weight:650;text-align:center}.tg button.on{border-color:var(--red);background:var(--soft);color:var(--red)}
.ln{width:100%;border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font:inherit;font-size:13px;margin-top:8px;color:var(--fg);outline:0}
.lk{font-size:12px;font-weight:650;color:var(--mut);min-height:32px}
/* v3 */
.dock{position:absolute;left:12px;right:12px;bottom:80px;z-index:3}
.pill{background:#fff;border-radius:22px;box-shadow:0 2px 14px #0002;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:6px;min-height:44px}.pill .in{flex:1;font-size:13px;color:var(--mut)}.pill .ic{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}.pill .snd{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:15px}
.panel{background:#fff;border-radius:20px;box-shadow:0 2px 18px #0003;padding:10px 12px 8px}.seg{display:flex;gap:6px;margin-bottom:6px}.seg button{min-height:30px;padding:0 12px;border-radius:15px;background:var(--bg);font-size:12px;font-weight:650}.seg button.on{background:var(--fg);color:#fff}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#15171b;color:#fff;border-radius:14px;padding:11px 14px;font-size:12px;line-height:1.4;z-index:9}
</style></head><body>
<div class="top"><h1>Post langsung di timeline — 3 opsi</h1><p>Tanpa pindah layar: menulis terjadi di tempat, di dalam Feeds. Layar bisa diklik; setelah kirim, post muncul di atas dengan status "Sedang ditinjau".</p>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-o="0">1 · Kartu di atas</button><button role="tab" aria-selected="false" data-o="1">2 · Saran kontekstual</button><button role="tab" aria-selected="false" data-o="2">3 · Bilah di bawah</button></div></div>
<div class="note" id="note"></div>
<div class="phone" id="phone"></div>
<script>
const g=id=>document.getElementById(id);const C=['#c2410c','#0f766e','#4338ca'];
const N=['<b>1 · Kartu di atas.</b> Kartu "Bagikan sesuatu…" di puncak timeline, dengan jalan pintas Foto, Tempat, Tanya. Diketuk, kartu melebar di tempat. Paling familier (gaya Facebook), cocok untuk semua jenis post.','<b>2 · Saran kontekstual.</b> Kartu di atas timeline yang menyarankan sesuai Agenda: "Kemarin kamu ke Ichiran Shibuya. Bagikan tipsnya?". Satu ketukan tag, satu baris opsional, kirim. Paling sedikit usaha dan menghasilkan tips terstruktur. Tampil hanya saat ada tempat dari Agenda; "Tulis bebas" tetap tersedia.','<b>3 · Bilah di bawah.</b> Kolom input menempel di atas tab bar, seperti chat. Diketuk, naik jadi panel kecil dengan pilihan Cerita, Tips, Tanya. Timeline tetap terlihat di belakangnya, dan kolom selalu terjangkau ibu jari tanpa menggulir ke atas.'];
const st={o:0,open:false,txt:'',ph:false,pl:false,tags:[],line:'',kind:'Cerita',sent:null,toast:false,dis:false};
const reset=()=>Object.assign(st,{open:false,txt:'',ph:false,pl:false,tags:[],line:'',kind:'Cerita',sent:null,toast:false,dis:false});
const post=(n,i,w,k,b,img,pl)=>`<div class="card"><div class="ph"><span class="av" style="background:${C[i]}">${n[0]}</span><div><strong>${n}</strong><small>${w}</small></div><span class="badge">${k}</span></div><p>${b}</p>${img?`<div class="img" style="background:${img}">Foto</div>`:''}${pl?`<div class="pl">📍 ${pl} · <b>Simpan ke Agenda</b></div>`:''}<div class="acts"><span>♡ 48</span><span>💬 12</span><span>Simpan</span></div></div>`;
const feed=post('Rani',0,'Jakarta · 2 jam lalu','Jepang','Ramen Ichiran Shibuya antre 40 menit jam 19.00, datang jam 15.00 langsung masuk.',C[0],'Ichiran Shibuya')+post('Dimas',1,'Surabaya · 5 jam lalu','Tanya','JR Pass atau tiket satuan untuk 5 hari Kyoto–Osaka?')+post('Sari',2,'Bandung · Kemarin','Trip','Itinerary 6 hari Seoul – Busan, budget Rp 12 jt per orang.',C[1]);
const nav=`<div class="nav"><button class="ib" aria-label="Kembali">‹</button><h2>Feeds traveler</h2><button class="ib" aria-label="Cari">⌕</button></div><div class="chips">${['Untuk kamu','Jepang','Korea','Tips','Tanya'].map((c,i)=>`<span class="chip ${i?'':'on'}">${c}</span>`).join('')}</div>`;
const mine=()=>st.sent?`<div class="card pend"><div class="ph"><span class="av" style="background:#c2410c">R</span><div><strong>Rani · kamu</strong><small>Baru saja</small></div><span class="badge w">Sedang ditinjau</span></div><p>${st.sent}</p><div class="pl">Hanya kamu yang melihat ini sampai disetujui (biasanya kurang dari 1 jam).</div></div>`:'';
const tabbar=`<div class="tabbar"><span>Beranda</span><span class="on">Jelajah</span><span>Perjalanan</span><span>Dompet</span><span>Profil</span></div>`;
function v0(){const c=st.open?`<div class="card"><div class="row"><span class="av" style="background:#c2410c">R</span><div><strong style="font-size:13px">Rani · Jakarta</strong><div style="font-size:11px;color:var(--mut)">Jepang · dari trip aktif</div></div></div><textarea class="ta" id="ta" maxlength="500" placeholder="Bagikan tips, cerita, atau tanya traveler lain…">${st.txt}</textarea>${st.pl?'<span class="chip" style="background:#e2f4e8;color:var(--ok);border:0">📍 Ichiran Shibuya</span>':''}${st.ph?'<div class="img" style="background:#c2410c;height:90px">1 foto</div>':''}<div class="bar2"><button class="t ${st.ph?'on':''}" data-a="ph">▣ Foto</button><button class="t ${st.pl?'on':''}" data-a="pl">📍 Tempat</button><span class="sp" id="cnt">${st.txt.length}/500</span></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="cancel" data-a="cancel">Batal</button><button class="go" data-a="send" id="go" ${st.txt?'':'disabled'}>Kirim</button></div><div style="font-size:11px;color:var(--mut);margin-top:6px">Lokasi tepat tidak ditampilkan. Post pertama ditinjau tim dulu.</div></div>`
 :`<div class="card"><div class="row"><span class="av" style="background:#c2410c">R</span><button class="fake" data-a="open">Bagikan tips atau tanya traveler…</button></div><div class="qa"><button data-a="open">▣ Foto</button><button data-a="openpl">📍 Tempat</button><button data-a="openq">? Tanya</button></div></div>`;
 return `<div class="scr">${nav}${c}${mine()}${feed}</div>`+tabbar}
function v1(){const tags=['Antre','Murah','Worth it','Ramai','Enak','Sepi'];
 const c=st.dis?`<button class="lk" data-a="undis" style="margin-bottom:8px">Saran disembunyikan · Tampilkan lagi</button>`:`<div class="card sg"><div class="k">Dari Agendamu</div><h3>Kemarin kamu ke Ichiran Shibuya. Bagikan tipsnya?</h3><div class="s">Tokyo 5 hari · Hari 2 · Makan</div><div class="tg">${tags.map(t=>`<button class="${st.tags.includes(t)?'on':''}" data-tg="${t}">${t}</button>`).join('')}</div>${st.tags.length?`<input class="ln" id="ln" maxlength="140" placeholder="Satu baris tips (opsional)" value="${st.line}"><div class="row" style="justify-content:space-between;margin-top:8px"><span style="font-size:11px;color:var(--mut)">Tampil sebagai Rani · Jakarta</span><button class="go" data-a="send">Kirim tips</button></div>`:`<div class="row" style="justify-content:space-between;margin-top:6px"><button class="lk" data-a="free">Tulis bebas</button><button class="lk" data-a="dis">Bukan sekarang</button></div>`}</div>`;
 return `<div class="scr">${nav}${c}${mine()}${feed}</div>`+tabbar}
function v2(){const d=st.open?`<div class="dock"><div class="panel"><div class="seg">${['Cerita','Tips','Tanya'].map(k=>`<button class="${st.kind==k?'on':''}" data-k="${k}">${k}</button>`).join('')}</div><textarea class="ta" id="ta" style="min-height:70px;margin:0" maxlength="500" placeholder="${st.kind=='Tanya'?'Tanya apa ke traveler lain?':st.kind=='Tips'?'Tips apa yang ingin dibagikan?':'Ceritakan perjalananmu…'}">${st.txt}</textarea><div class="bar2"><button class="t ${st.ph?'on':''}" data-a="ph">▣</button><button class="t ${st.pl?'on':''}" data-a="pl">📍 Tempat</button><span class="sp" id="cnt">${st.txt.length}/500</span><button class="cancel" data-a="cancel">Tutup</button><button class="go" data-a="send" id="go" ${st.txt?'':'disabled'}>Kirim</button></div></div></div>`
 :`<div class="dock"><div class="pill"><button class="in" data-a="open" style="text-align:left">Tulis atau tanya traveler…</button><button class="ic" data-a="open" aria-label="Foto">▣</button><button class="ic" data-a="openpl" aria-label="Tempat">📍</button><button class="snd" data-a="open" aria-label="Tulis">↑</button></div></div>`;
 return `<div class="scr">${nav}${mine()}${feed}</div>${st.open?'<div style="position:absolute;inset:0;background:#0003;z-index:2" data-a="cancel"></div>':''}`+d+tabbar}
function render(){const ph=g('phone');ph.innerHTML=[v0,v1,v2][st.o]()+(st.toast?`<div class="toast">Terkirim. Postingan pertamamu ditinjau dulu.</div>`:'');
 document.querySelectorAll('.tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j==st.o));g('note').innerHTML=N[st.o];bind()}
function bind(){const ph=g('phone');
 const ta=g('ta');if(ta){ta.oninput=()=>{st.txt=ta.value;g('go').disabled=!st.txt;g('cnt').textContent=st.txt.length+'/500'};if(st.open&&!st.txt)ta.focus()}
 const ln=g('ln');if(ln)ln.oninput=()=>st.line=ln.value;
 ph.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const t=b.dataset.tg,k=st.tags.indexOf(t);if(k>=0)st.tags.splice(k,1);else if(st.tags.length<3)st.tags.push(t);render()});
 ph.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;render()});
 const sendTxt=()=>{if(st.o==1)return `Ichiran Shibuya · ${st.tags.join(', ')}${st.line?' — '+st.line:''}`;return st.txt};
 const A={open:()=>{st.open=true;render()},openpl:()=>{st.open=true;st.pl=true;render()},openq:()=>{st.open=true;st.txt='';render()},cancel:()=>{st.open=false;render()},ph:()=>{st.ph=!st.ph;render()},pl:()=>{st.pl=!st.pl;render()},
  send:()=>{st.sent=sendTxt();st.open=false;st.toast=true;st.tags=[];st.txt='';st.line='';render();ph.querySelector('.scr').scrollTop=0;setTimeout(()=>{st.toast=false;render()},3200)},
  dis:()=>{st.dis=true;render()},undis:()=>{st.dis=false;render()},free:()=>{st.o=0;st.open=true;render()}};
 ph.querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();A[b.dataset.a]&&A[b.dataset.a]()})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{reset();st.o=+b.dataset.o;render()});
render();
</script></body></html>
