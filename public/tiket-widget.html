<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hasil penerbangan</title>
    <!--
      Frame for the Travelpayouts White Label widget, opened by /tiket (flight-results.tsx). The
      partner's stylesheet carries a global reset (margin, padding and font-family on html, body,
      div, p, a, h1 ... in its own cascade layer) that beats Tailwind and survives navigation, so it
      must never run inside the app page itself. Here it can reset what it likes.
      The White Label id arrives in the hash (#24328) and the search in ?flightSearch=<code>, which
      the widget reads from this address. The page reports its height to the parent so the frame
      grows with the results instead of scrolling inside the app.
    -->
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family:
          -apple-system, "SF Pro Text", "SF Pro Display", Inter, system-ui, "Segoe UI", Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Djiwa's red and the app's font in place of the dashboard defaults. */
      :root,
      #tpwl-tickets,
      #tpwl-search,
      #tpwl-modals {
        --main-accent: #e5383b !important;
        --main-accent-darken: #cf2f32 !important;
        --main-accent-opacified: rgba(229, 56, 59, 0.1) !important;
        --main-accent-contrast-color: #ffffff !important;
        --link-color: #e5383b !important;
        --link-color-darken: #cf2f32 !important;
        --search-form-icon-color: #e5383b !important;
        --font-main:
          -apple-system, "SF Pro Text", Inter, system-ui, "Segoe UI", Roboto, sans-serif !important;
        --border-radius: 14px !important;
      }

      /*
        Compact iOS density. The widget sizes everything in rem, so a smaller root size shrinks the
        cards in one move (prices 23px -> 18px, buttons 36px -> 30px). The rules below then tighten
        the spacing the widget hard-codes. Class names are CSS-module names with a build hash, so
        match on the stable part.
      */
      html {
        font-size: 12.5px;
      }
      [class*="TicketsWidget-module__wrapper"] {
        gap: 0.6rem !important;
      }
      [class*="TicketsWidget-module__root"] {
        margin-top: 0.25rem !important;
        grid-row-gap: 0.6rem !important;
      }
      [class*="FlightCard-module__card___"] {
        margin-bottom: 0 !important;
        border: 0 !important;
        border-radius: 16px !important;
        box-shadow: 0 0 0 1px rgba(17, 33, 56, 0.06) !important;
      }
      [class*="FlightCard-module__cardLeft___"] {
        margin-bottom: 0.75rem !important;
      }
      [class*="FlightCard-module__cardBlockFlight___"] {
        margin-top: 0.6rem !important;
      }
      [class*="FlightCard-module__cardLeftButton"] {
        min-height: 2.1rem !important;
        padding: 0.4rem 1.1rem !important;
        border-radius: 999px !important;
      }
      [class*="TicketsWidget-module__moreTickets"] {
        margin: 0.25rem 0 1rem !important;
        padding: 0.7rem 0 !important;
        border-radius: 14px !important;
        font-size: 1rem !important;
      }

      /* Airport names under the codes and the airline line, added by the script below. */
      [class*="FlightCard-module__card___"] [data-djiwa-airport] {
        display: block;
        max-width: 8.5rem;
        font-size: 0.8rem !important;
        line-height: 1.2 !important;
        white-space: normal;
      }
      .djiwa-airline {
        margin: 0.6rem 0 0 !important;
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.2;
        color: #1f1f26;
      }
    </style>
  </head>
  <body>
    <div id="tpwl-tickets"></div>
    <script>
      (function () {
        var id = (location.hash || "").replace("#", "");
        if (!/^[0-9]{1,9}$/.test(id)) return;
        var script = document.createElement("script");
        script.type = "module";
        script.async = true;
        script.src = "https://tpwdgt.com/wl_web/main.js?wl_id=" + id;
        document.head.appendChild(script);

        function report() {
          var height = Math.ceil(document.documentElement.scrollHeight);
          try {
            parent.postMessage({ type: "djiwa-tpwl-height", height: height }, location.origin);
          } catch (e) {
            /* No parent (opened on its own): nothing to tell. */
          }
        }

        /*
          The widget shows bare IATA codes and airline logos. Spell them out: the airport name next
          to each code and the airline name above each leg. Names come from the Travelpayouts public
          data (CORS open); on any failure the widget stays as it was.
        */
        var airports = {};
        var airlines = null;
        function airportName(code) {
          if (!airports[code]) {
            airports[code] = fetch(
              "https://autocomplete.travelpayouts.com/places2?locale=id&types[]=airport&types[]=city&term=" +
                code,
            )
              .then(function (r) {
                return r.json();
              })
              .then(function (rows) {
                var hit =
                  rows.filter(function (x) {
                    return x.code === code;
                  })[0] || rows[0];
                if (!hit) return "";
                return String(hit.name || hit.city_name || "").replace(
                  /\s+(International\s+)?Airport$/i,
                  "",
                );
              })
              .catch(function () {
                return "";
              });
          }
          return airports[code];
        }
        function loadAirlines() {
          if (!airlines) {
            airlines = fetch("https://api.travelpayouts.com/data/id/airlines.json")
              .then(function (r) {
                return r.json();
              })
              .then(function (rows) {
                var map = {};
                rows.forEach(function (a) {
                  map[a.code] = a.name || (a.name_translations && a.name_translations.en) || "";
                });
                return map;
              })
              .catch(function () {
                return {};
              });
          }
          return airlines;
        }
        function enhance() {
          var cards = document.querySelectorAll('[class*="FlightCard-module__card___"]');
          cards.forEach(function (card) {
            var walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT);
            var nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(function (node) {
              var code = (node.nodeValue || "").trim();
              if (!/^[A-Z]{3}$/.test(code)) return;
              var host = node.parentNode;
              if (!host || host.dataset.djiwaAirport) return;
              host.dataset.djiwaAirport = code;
              airportName(code).then(function (name) {
                if (name) node.nodeValue = name + " (" + code + ")";
              });
            });
            card.querySelectorAll('[class*="cardBlockFlight___"]').forEach(function (block) {
              if (block.dataset.djiwaAirline) return;
              var tokens = [];
              block.querySelectorAll("img").forEach(function (img) {
                ((img.getAttribute("src") || "") + " " + (img.getAttribute("alt") || ""))
                  .split(/[\/?&=._@-]/)
                  .forEach(function (t) {
                    if (/^[A-Z0-9]{2}$/.test(t) && tokens.indexOf(t) < 0) tokens.push(t);
                  });
              });
              if (!tokens.length) return;
              block.dataset.djiwaAirline = "1";
              loadAirlines().then(function (map) {
                var names = tokens
                  .map(function (c) {
                    return map[c];
                  })
                  .filter(Boolean);
                if (!names.length || !block.parentNode) return;
                var line = document.createElement("div");
                line.className = "djiwa-airline";
                line.textContent = names.join(" + ");
                block.parentNode.insertBefore(line, block);
              });
            });
          });
        }
        if ("MutationObserver" in window) {
          var pending = 0;
          new MutationObserver(function () {
            clearTimeout(pending);
            pending = setTimeout(enhance, 150);
          }).observe(document.body, { childList: true, subtree: true });
        }
        if ("ResizeObserver" in window) new ResizeObserver(report).observe(document.body);
        window.addEventListener("load", report);
        window.addEventListener("resize", report);
      })();
    </script>
  </body>
</html>
