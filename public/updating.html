<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="refresh" content="4" />
    <meta name="robots" content="noindex" />
    <title>Sedang diperbarui — Djiwa Travel</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; background: #f2f3f5; color: #1c1c1e; }
      main { max-width: 320px; text-align: center; }
      .dot { width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid #e4e4e8; border-top-color: #c4353b; animation: spin 0.9s linear infinite; }
      h1 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
      p { margin: 0; font-size: 13px; line-height: 1.45; color: #62626a; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; margin-top: 16px; padding: 0 20px; border-radius: 12px; background: #c4353b; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main role="status">
      <div class="dot" aria-hidden="true"></div>
      <h1>Sedang diperbarui</h1>
      <p>Djiwa Travel sedang memasang versi terbaru. Halaman ini memuat ulang otomatis, data dan sesi login kamu aman.</p>
      <a href="/">Muat ulang sekarang</a>
    </main>
  </body>
</html>
